<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Condufy</title>
<meta name="description" content="Prepara el examen teórico de la DGT jugando: lecciones y tests estilo examen real.">
<meta name="theme-color" content="#2058CC">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Condufy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#2F6FED; --violet-deep:#1F53BE; --violet-soft:#9DBBF7;
  --violet-tint:#EAF1FE; --violet-tint2:#D6E6FD;
  --teal:#22B07D; --teal-deep:#1B9068;
  --gold:#FFC83D; --fire:#FF7A3D;
  --ink:#2C2A3A; --muted:#8E8C9C; --line:#ECEAF3;
  --bg:#FFFFFF; --panel:#F5F6FC; --code-bg:#F0F4FB;
  --ok:#2FB57F; --ok-bg:#E4F7EE; --bad:#E24C6E; --bad-bg:#FBE7EC;
  --shadow:0 18px 45px rgba(30,60,140,.14);
}
.dark{
  --ink:#F2F0FA; --muted:#A6A3B8; --line:#37344A;
  --bg:#22212B; --panel:#2C2A38; --code-bg:#2A2837; --violet-tint:#28324A; --violet-tint2:#2E3C5A;
  --ok-bg:#183a2d; --bad-bg:#3a1f28;
}
.gold{
  --violet:#C8891A; --violet-deep:#A66E10; --violet-soft:#E8BE63;
  --violet-tint:#FBEACB; --violet-tint2:#F5DDA0;
}
.gold.dark{ --violet-tint:#3A2E12; --violet-tint2:#4A3A16; }
.gold::before{content:"✨ Premium";position:absolute;top:8px;right:14px;font-size:9.5px;font-weight:800;
  color:#A66E10;background:#FBEACB;padding:3px 9px;border-radius:10px;letter-spacing:.4px;z-index:40;pointer-events:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, #1E2A44 0%, #141B30 55%, #0E121F 100%);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;color:var(--ink);
}
.phone{
  position:relative;width:100%;max-width:400px;height:min(860px,94vh);
  background:var(--bg);border-radius:28px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.45);
  transition:background .35s;
  display:flex;flex-direction:column;color:var(--ink);
}
@media (max-width:480px){
  body{padding:0;background:var(--bg)}
  .phone{max-width:none;width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;padding-top:calc(14px + env(safe-area-inset-top))}
.screen::-webkit-scrollbar{display:none}
.logo{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:100%;height:100%;display:block}
.wordmark{font-weight:800;letter-spacing:-.5px}
.wordmark .fy{color:var(--violet)}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:16px;transition:transform .12s, box-shadow .2s, opacity .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--violet);color:#fff;padding:15px;width:100%;font-size:16px;box-shadow:0 8px 20px rgba(47,111,237,.35)}
.btn-primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn-ghost{background:var(--violet-tint);color:var(--violet);padding:13px;width:100%;font-size:15px}
#splash{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:50;transition:opacity .5s}
#splash .logo{width:118px;height:118px}
#splash .name{font-size:30px}
.spinner{width:34px;height:34px;border:4px solid var(--violet-tint2);border-top-color:var(--violet);border-radius:50%;animation:spin .8s linear infinite;margin-top:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.pad{padding:8px 26px 26px}
.login-head{display:flex;align-items:center;gap:10px;margin:6px 0 30px}
.login-head .logo{width:40px;height:40px}
.auth-tabs{display:flex;gap:8px;background:var(--panel);border-radius:14px;padding:4px;margin:20px 0 24px}
.auth-tab{flex:1;border:none;background:none;font-family:inherit;font-weight:700;font-size:14px;padding:10px;border-radius:11px;cursor:pointer;color:var(--muted)}
.auth-tab.active{background:var(--bg);color:var(--violet);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.field-msg{font-size:12px;font-weight:600;margin-top:6px;min-height:14px}
.field-msg.ok{color:var(--ok)}
.field-msg.bad{color:var(--bad)}
.field{margin-bottom:20px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.input-wrap{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--line);padding:8px 2px}
.input-wrap svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.input-wrap input{border:none;outline:none;background:none;font-family:inherit;font-size:15px;width:100%;color:var(--ink)}
.input-wrap input::placeholder{color:#B9B7C6}
.eye{margin-left:auto;cursor:pointer;color:var(--muted)}
.enter-wrap{display:flex;justify-content:center;margin:30px 0}
.btn-enter{background:var(--violet-soft);color:#fff;padding:10px 34px;border-radius:20px;font-size:16px;box-shadow:0 6px 16px rgba(47,111,237,.28)}
.home-head{display:flex;align-items:center;gap:10px;padding:6px 22px 0}
.home-head .logo{width:38px;height:38px}
.home-head .wordmark{font-size:20px}
.home-head .icons{margin-left:auto;display:flex;align-items:center;gap:12px}
.gear{width:34px;height:34px;color:var(--muted);cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;cursor:pointer}
.greet{padding:14px 22px 0;font-size:24px;font-weight:700}
.stats{display:flex;gap:16px;padding:8px 22px 0}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE38A,var(--gold));border:2px solid #E9A81E}
.flame{font-size:18px}
.progress-sec{padding:16px 22px 0}
.progress-sec h3{font-size:19px;font-weight:700;margin-bottom:2px}
.lvl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px}
.bar{height:12px;background:var(--line);border-radius:20px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#6EA0F5);border-radius:20px;transition:width .6s}
.xp-label{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;font-weight:500}
.daily{margin:18px 22px 0;background:linear-gradient(135deg,var(--teal),#63D8A9);border-radius:20px;padding:16px 18px;color:#fff;box-shadow:0 12px 24px rgba(34,176,125,.35);cursor:pointer}
.daily .k{font-size:13px;font-weight:600;opacity:.9}
.daily .t{font-size:19px;font-weight:800;margin:2px 0 12px}
.daily .play{display:inline-flex;align-items:center;gap:7px;background:var(--violet);color:#fff;padding:9px 20px;border-radius:20px;font-weight:700;font-size:14px}
.review-card{display:flex;align-items:center;gap:12px;margin:14px 22px 0;background:var(--panel);border-radius:18px;padding:14px 16px;cursor:pointer}
.review-ic{width:38px;height:38px;border-radius:50%;background:var(--violet-tint);color:var(--violet);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.review-ic svg{width:19px;height:19px}
.review-t{font-weight:700;font-size:14.5px}
.review-d{font-size:12px;color:var(--muted);margin-top:1px}
.review-btn{background:var(--violet);color:#fff;padding:8px 14px;border-radius:16px;font-weight:700;font-size:12.5px;flex-shrink:0}
.path-head{padding:22px 22px 4px;font-size:19px;font-weight:700}
.path{padding:2px 18px 20px}
.node{display:flex;align-items:center;gap:14px;padding:11px 4px;position:relative}
.node:not(:last-child)::before{content:"";position:absolute;left:22px;top:44px;bottom:-4px;width:2.5px;background:var(--line)}
.node.done:not(:last-child)::before,.node.current:not(:last-child)::before{background:var(--violet-soft)}
.n-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:2;font-size:17px;border:2.5px solid var(--line);color:var(--muted);background:var(--bg)}
.node.done .n-ic{background:var(--violet);border-color:var(--violet);color:#fff}
.node.current .n-ic{border-color:var(--violet);color:var(--violet);background:var(--violet-tint);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,111,237,.35)}50%{box-shadow:0 0 0 7px rgba(47,111,237,0)}}
.n-label{font-weight:600;font-size:15px;flex:1}
.node.locked .n-label{color:var(--muted)}
.n-check{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:#fff;flex-shrink:0}
.node.done .n-check{background:var(--violet)}
.chev{color:var(--muted)}
.node.clickable{cursor:pointer}
.node.clickable:active{opacity:.6}
.nav{display:flex;justify-content:space-around;align-items:center;padding:10px 4px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);flex-shrink:0}
.nav button{background:none;border:none;cursor:pointer;padding:5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-family:inherit;font-weight:600}
.nav button.active{color:var(--violet)}
.nav svg{width:22px;height:22px}
#lessonScreen{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
#lessonScreen.open{transform:translateY(0)}
.lesson-top{display:flex;align-items:center;gap:14px;padding:18px 22px 0}
.lesson-top .x{cursor:pointer;color:var(--ink);font-size:24px;line-height:1;background:none;border:none;padding:4px}
.lesson-top h2{font-size:17px;font-weight:700}
.lesson-bar{height:9px;background:var(--line);border-radius:20px;margin:14px 22px 0;overflow:hidden}
.lesson-bar>span{display:block;height:100%;background:var(--violet);border-radius:20px;transition:width .4s}
.lesson-body{flex:1;overflow-y:auto;padding:20px 22px 24px;scrollbar-width:none}
.lesson-body::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tab{flex:1;padding:11px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;font-family:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.tab.active{border-color:var(--violet);color:var(--violet);background:var(--violet-tint)}
.lesson-body h3{font-size:20px;font-weight:800;margin-bottom:14px}
.lesson-body p{color:var(--muted);font-size:14.5px;line-height:1.65;margin-bottom:12px}
.lesson-body p b{color:var(--ink)}
.code{background:var(--code-bg);border-radius:14px;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.85;margin:8px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.code b{color:var(--violet)}
.chart-box{background:var(--code-bg);border-radius:14px;padding:14px 12px;margin:8px 0 4px;text-align:center}
.chart-box svg{max-width:100%;height:auto;display:inline-block}
.caption{font-size:13px;color:var(--muted);margin-top:12px;font-style:italic}
.lesson-foot{padding:14px 22px calc(18px + env(safe-area-inset-bottom))}
.q-kicker{font-size:12px;font-weight:700;color:var(--violet);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.q-text{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:20px}
.qimg{width:132px;height:132px;margin:0 auto 18px;padding:10px;border-radius:20px;background:var(--violet-tint);display:flex;align-items:center;justify-content:center}
.qimg.small{width:64px;height:64px;margin:0 0 10px;padding:8px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{padding:15px 18px;border:2px solid var(--line);border-radius:15px;font-size:14.5px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--ink);text-align:left;transition:.15s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--violet);background:var(--violet-tint)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin-top:12px}
.feedback{margin-top:18px;padding:14px 16px;border-radius:14px;font-size:14px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback .fb-row{display:flex;align-items:flex-start;gap:10px}
.feedback svg{width:20px;height:20px;flex-shrink:0}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.no{background:var(--bad-bg);color:var(--bad)}
.complete{text-align:center;padding:40px 26px}
.complete .medal{width:110px;height:110px;margin:10px auto 22px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--violet));display:flex;align-items:center;justify-content:center;font-size:52px;animation:pop .5s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.complete h2{font-size:26px;font-weight:800;margin-bottom:6px}
.complete .sub{color:var(--muted);margin-bottom:26px}
.rewards{display:flex;gap:14px;justify-content:center;margin-bottom:30px}
.reward{background:var(--panel);border-radius:16px;padding:16px 22px;min-width:96px}
.reward .v{font-size:24px;font-weight:800}
.reward .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.page{padding:6px 22px 20px}
.page h1{font-size:24px;font-weight:800;margin:10px 0 4px}
.page .lead{color:var(--muted);font-size:14px;margin-bottom:20px}
.wallet{display:inline-flex;align-items:center;gap:8px;background:var(--violet-tint);color:var(--violet);padding:8px 16px;border-radius:20px;font-weight:700;margin-bottom:20px}
.shop-item{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:18px;padding:15px;margin-bottom:12px}
.shop-emoji{width:50px;height:50px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.shop-info{flex:1}
.shop-info .t{font-weight:700;font-size:15px}
.shop-info .d{font-size:12.5px;color:var(--muted)}
.shop-info .badge{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.shop-info .badge.pass{background:var(--ok-bg);color:var(--ok)}
.shop-info .badge.fail{background:var(--bad-bg);color:var(--bad)}
.buy{background:var(--violet);color:#fff;border:none;border-radius:14px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0}
.buy:disabled{opacity:.4}
.buy .coin{width:15px;height:15px;border-width:1.5px}
.owned{color:var(--ok);font-weight:700;font-size:13px;flex-shrink:0}
.lb-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.add-friend-box{background:var(--panel);border-radius:16px;padding:16px;margin-bottom:16px}
.my-code{font-size:13px;color:var(--muted);margin-bottom:14px}
.my-code b{color:var(--violet);letter-spacing:.5px}
.lb-rank{width:26px;font-weight:800;color:var(--muted);text-align:center}
.lb-row.me .lb-rank{color:var(--violet)}
.lb-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.lb-name{flex:1;font-weight:600;font-size:15px}
.lb-row.me .lb-name{color:var(--violet)}
.lb-xp{font-weight:700;font-size:14px;color:var(--muted)}
.profile-hero{text-align:center;padding:16px 0 8px}
.profile-hero .big-av{width:88px;height:88px;border-radius:50%;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;margin:0 auto 12px}
.profile-hero .pname{font-size:22px;font-weight:800}
.profile-hero .pjoin{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.gcard{background:var(--panel);border-radius:16px;padding:16px}
.gcard .gv{font-size:24px;font-weight:800}
.gcard .gl{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.setting-row{display:flex;align-items:center;gap:12px;padding:15px 2px;border-top:1px solid var(--line);font-weight:600;font-size:15px}
.setting-row svg{width:22px;height:22px;flex-shrink:0;color:var(--muted)}
.toggle{margin-left:auto;width:48px;height:28px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:.2s}
.toggle.on{background:var(--violet)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on::after{left:23px}
.toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:80;white-space:nowrap;max-width:88%;text-align:center;white-space:normal}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.floater{position:absolute;font-weight:800;font-size:22px;color:var(--violet);pointer-events:none;animation:float-up 1s ease-out forwards;z-index:70}
@keyframes float-up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
#onboarding{position:absolute;inset:0;background:var(--bg);z-index:90;display:none;flex-direction:column}
#onboarding.open{display:flex}
.ob-skip{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:6px}
.ob-top-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.ob-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 30px}
.ob-icon{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:26px;background:var(--violet-tint)}
.ob-body h2{font-size:23px;font-weight:800;margin-bottom:12px}
.ob-body p{color:var(--muted);font-size:15px;line-height:1.6;max-width:280px}
.ob-foot{padding:18px 26px calc(22px + env(safe-area-inset-bottom))}
.ob-dots{display:flex;justify-content:center;gap:7px;margin-bottom:20px}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.25s}
.ob-dot.active{width:20px;border-radius:5px;background:var(--violet)}
.ob-back{background:var(--panel);border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0}
.confirm-overlay{position:absolute;inset:0;background:rgba(15,18,30,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:30px}
.confirm-card{background:var(--bg);border-radius:22px;padding:28px 24px;text-align:center;max-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.confirm-ic{font-size:36px;margin-bottom:10px}
.confirm-card h3{font-size:18px;font-weight:800;margin-bottom:8px}
.confirm-card p{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:20px}
.confirm-actions{display:flex;gap:10px}
.confirm-actions button{flex:1;padding:12px}
.track-cards{display:flex;gap:14px;width:100%;margin-top:10px}
.track-card{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:20px 14px;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}
.track-card:active{transform:scale(.97)}
.track-emoji{font-size:34px;margin-bottom:8px}
.track-name{font-weight:800;font-size:16px;color:var(--tc)}
.track-tagline{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.track-pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:none;border-radius:14px;padding:5px 11px;font-family:inherit;font-weight:700;font-size:12px;color:var(--ink);cursor:pointer}
.disclaimer-box{background:var(--panel);border-radius:16px;padding:16px;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:left;margin-top:14px;max-height:38vh;overflow-y:auto}
.disclaimer-box b{color:var(--ink)}
.disclaimer-box p{margin-bottom:10px}
.disclaimer-box p:last-child{margin-bottom:0}
.disclaimer-note{font-size:11px;color:var(--muted);text-align:center;padding:10px 22px 0;line-height:1.5}
.testlen-row{display:flex;gap:10px;margin-bottom:16px}
.testlen-btn{flex:1;padding:14px 6px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-family:inherit;cursor:pointer;text-align:center}
.testlen-btn.active{border-color:var(--violet);background:var(--violet-tint)}
.testlen-btn .n{font-size:20px;font-weight:800;color:var(--ink)}
.testlen-btn .l{font-size:11px;color:var(--muted);font-weight:600}
.score-ring{width:150px;height:150px;margin:6px auto 18px;position:relative;display:flex;align-items:center;justify-content:center}
.score-ring .sv{font-size:34px;font-weight:800}
.score-ring .sl{font-size:12px;color:var(--muted);font-weight:600}
.reviewq{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;text-align:left}
.reviewq .rq-top{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase}
.reviewq.ok .rq-top{color:var(--ok)}
.reviewq.no .rq-top{color:var(--bad)}
.reviewq .rq-q{font-weight:700;font-size:14.5px;margin-bottom:8px}
.reviewq .rq-a{font-size:13px;margin-bottom:3px}
.reviewq .rq-a.your{color:var(--bad)}
.reviewq .rq-a.correct{color:var(--ok)}
.reviewq .rq-exp{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.stat,.gv,.lb-xp,.xp-label,.testlen-btn .n{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

function loadAccounts(){ try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY))||{}; }catch(e){ return {}; } }
function saveAccounts(a){ try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }catch(e){} }

function loadState(u){ try{ return JSON.parse(localStorage.getItem(stateKey(u))); }catch(e){ return null; } }
function saveState(u, state){ try{ localStorage.setItem(stateKey(u), JSON.stringify(state)); }catch(e){} }
function makeFriendCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="CND-"; for(let i=0;i<5;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function ensureDemoAccounts(){
  const acc = loadAccounts();
  const demo = [
    {u:"laia", name:"Laia", color:"#FF7A3D", xp:1840},
    {u:"bruno", name:"Bruno", color:"#22B07D", xp:1520},
    {u:"nora", name:"Nora", color:"#E23D6E", xp:430},
    {u:"pol", name:"Pol", color:"#2FB57F", xp:310},
  ];
  let changed=false;
  demo.forEach(d=>{ if(!acc[d.u]){ acc[d.u]={username:d.name, password:null, displayName:d.name, friendCode:makeFriendCode(), avatarColor:d.color, provider:"npc", demoXp:d.xp, createdAt:Date.now()}; changed=true; } });
  if(changed) saveAccounts(acc);
  return acc;
}
function freshState(){
  return {
    screen:"login", tab:"home", dark:false,
    xp:0, diamonds:0, streak:0, lives:5, maxLives:5, nextLifeCost:20, lastLifeRefill:null, freezes:0, lastPracticeDay:null,
    completed:{coche:{}, moto:{}}, track:"coche", onboardedTracks:{},
    theme_dark_owned:false, theme_gold_owned:false, goldActive:false,
    onboarded:false, disclaimerAccepted:false, reminders:true, level:null,
    friends:["laia","bruno","nora","pol"],
    activeLesson:null, exIndex:0, exStartTime:0, sessionXp:0, sessionGems:0,
    testHistory:{coche:{}, moto:{}},
  };
}
function migrateState(s){
  if(!s.completed) s.completed = {coche:{}, moto:{}};
  if(!s.completed.coche) s.completed.coche = {};
  if(!s.completed.moto) s.completed.moto = {};
  if(!s.track || !["coche","moto"].includes(s.track)) s.track = "coche";
  if(!s.onboardedTracks) s.onboardedTracks = s.onboarded ? {coche:true} : {};
  if(!s.testHistory) s.testHistory = {coche:{}, moto:{}};
  if(s.disclaimerAccepted===undefined) s.disclaimerAccepted=false;
  return s;
}
function completed(){ return S.completed[S.track]; }
function setTrack(track){
  S.track = track;
  LESSONS = track==="moto" ? LESSONS_MOTO : LESSONS_COCHE;
}
ensureDemoAccounts();

let S;
const _session = (()=>{ try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; } })();
const _accounts = loadAccounts();
if(_session && _accounts[_session]){
  S = migrateState(Object.assign(freshState(), loadState(_session)||{}));
  S.username = _session;
  S.user = _accounts[_session].displayName || _accounts[_session].username;
  S.screen = "home";
} else {
  S = freshState();
  S.username = null;
  S.user = "";
}
function save(){ if(!S.username) return; try{ saveState(S.username, S); }catch(e){} }

const level = ()=> Math.floor(S.xp/XP_PER_LEVEL)+1;
const xpInLevel = ()=> S.xp % XP_PER_LEVEL;
function recordPractice(){
  const now=new Date();
  const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  if(S.lastPracticeDay===today) return;
  if(!S.lastPracticeDay) S.streak=1;
  else {
    const gap=Math.round((new Date(today+"T00:00:00")-new Date(S.lastPracticeDay+"T00:00:00"))/86400000);
    if(gap===1) S.streak++;
    else if(gap>1 && S.freezes>0) S.freezes--;
    else S.streak=1;
  }
  S.lastPracticeDay=today;
}
function refreshLives(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastLifeRefill!==today){ S.lives=S.maxLives||5; S.lastLifeRefill=today; }
}
function loseLife(){ refreshLives(); if(S.lives<=0) return false; S.lives--; save(); return true; }

   ex:[
    {type:"choice", q:"¿Está permitido dar la vuelta (cambio de sentido) en un túnel?", options:["Sí, si no hay tráfico","No, está prohibido","Solo de día"], answer:1},
    {type:"choice", q:"¿Se puede circular marcha atrás por una autovía para no perder una salida?", options:["Sí, unos metros está permitido","No, está totalmente prohibido","Sí, si activas las luces de emergencia"], answer:1},
    {type:"choice", q:"Poner el intermitente antes de girar…", options:["Te da prioridad automáticamente","Es obligatorio, pero no te da prioridad por sí solo","Es opcional si no hay tráfico detrás"], answer:1},
   ]},

 { title:"Autopistas y autovías", icon:"🛤️",
   explain:`<h3>Incorporación, arcén y carril izquierdo</h3>
   <p>Para incorporarte a una autopista o autovía debes usar el <b>carril de aceleración</b> y adaptar tu velocidad a la del tráfico antes de entrar, cediendo el paso a quienes ya circulan.</p>
   <p>El <b>arcén</b> no es un carril de circulación: solo se puede usar para pararse en caso de emergencia o avería, y por los vehículos que estén obligados o autorizados a ello.</p>
   <p>El <b>carril izquierdo</b> se reserva para adelantar; una vez completado el adelantamiento hay que volver a los carriles de la derecha, no "instalarse" en él.</p>`,
   example:{code:`Carril de aceleración → adapta tu velocidad\nCarriles centrales/derecha → circulación normal\nCarril izquierdo → solo para adelantar\nArcén → solo emergencias/averías`, caption:"Nunca pares en el arcén salvo emergencia real."},
   ex:[
    {type:"choice", q:"El carril de aceleración de una autopista sirve para…", options:["Adaptar tu velocidad a la del tráfico antes de incorporarte","Adelantar a los camiones","Estacionar brevemente"], answer:0},
    {type:"choice", q:"¿Se puede circular habitualmente por el arcén de una autovía?", options:["Sí, si hay poco tráfico","No, solo en caso de emergencia o avería (u otras excepciones señaladas)","Sí, si no se supera 60 km/h"], answer:1},
    {type:"choice", q:"El carril izquierdo de una autovía debe usarse…", options:["Para circular de forma habitual si vas más rápido","Solo mientras dura el adelantamiento","Para adelantar únicamente a camiones"], answer:1},
   ]},

 { title:"Alcohol, drogas y medicamentos", icon:"🍺",
   explain:`<h3>Tasas y tolerancia cero</h3>
   <p>La tasa máxima de alcohol permitida es de <b>0,25 mg/l</b> en aire espirado (0,50 g/l en sangre) para conductores en general. Para <b>conductores noveles</b> (menos de 2 años de carnet) y <b>conductores profesionales</b>, el límite se reduce a <b>0,15 mg/l</b> (0,30 g/l en sangre). Para los <b>menores de edad</b> que conduzcan cualquier vehículo, la tasa permitida es <b>0,0</b>.</p>
   <p>Con las <b>drogas</b>, la tolerancia es <b>cero</b>: no existe un umbral "seguro" legal, y su detección conlleva sanción penal o administrativa según el caso.</p>
   <p>Algunos <b>medicamentos</b> (ansiolíticos, antihistamínicos, ciertos analgésicos) también afectan a la capacidad de conducir: revisa siempre el prospecto y el pictograma correspondiente.</p>`,
   example:{code:`Tasa máxima de alcohol (aire espirado):\nConductor general:            0,25 mg/l\nNovel (<2 años) / profesional: 0,15 mg/l\nMenor de edad:                 0,00 mg/l\nDrogas: tolerancia cero`, caption:"Estos son los límites vigentes; comprueba siempre dgt.es ante cualquier duda, ya que la normativa puede cambiar."},
   ex:[
    {type:"choice", q:"¿Cuál es la tasa máxima de alcohol en aire espirado para un conductor novel (menos de 2 años de carnet)?", options:["0,25 mg/l","0,15 mg/l","0,50 mg/l"], answer:1},
    {type:"choice", q:"¿Cuál es la tasa de alcohol permitida a un menor de edad que conduce?", options:["0,25 mg/l, igual que a los adultos","0,15 mg/l","0,0 mg/l"], answer:2},
    {type:"choice", q:"Respecto a las drogas al volante, la tolerancia legal es…", options:["Cero, no existe un límite \"seguro\"","La misma que con el alcohol","Solo se sanciona si hay accidente"], answer:0},
   ]},

 { title:"Cansancio, distracciones y uso del móvil", icon:"📵",
   explain:`<h3>El enemigo silencioso</h3>
   <p>El <b>cansancio</b> y el <b>sueño</b> reducen los reflejos de forma similar al alcohol; se recomienda descansar al menos 15-20 minutos cada 2 horas o 200 km en viajes largos, y parar ante los primeros signos de somnolencia (bostezos, parpadeo lento, pérdida de concentración).</p>
   <p>Usar el <b>móvil sujetándolo con la mano</b> mientras conduces conlleva una sanción de <b>200 €</b> y la pérdida de <b>6 puntos</b> del carnet; manipularlo aunque esté en un soporte también está sancionado (200 € y 3 puntos), porque la distracción visual es igualmente peligrosa.</p>
   <p>Cualquier distracción (comer, manipular el GPS, discutir) multiplica el riesgo de accidente, aunque dure solo unos segundos.</p>`,
   example:{code:`Uso del móvil al volante:\nSujeto con la mano ............ 200€ y 6 puntos\nManipulado en soporte ......... 200€ y 3 puntos\nDescanso recomendado en viaje:\n15-20 min cada 2h / 200 km`, caption:"Estas cifras corresponden a la normativa vigente; verifícalas en dgt.es si ha pasado tiempo."},
   ex:[
    {type:"choice", q:"¿Cuántos puntos se pierden por sujetar el móvil con la mano mientras conduces?", options:["3 puntos","6 puntos","No se pierden puntos, solo hay multa"], answer:1},
    {type:"choice", q:"¿Está permitido manipular el móvil aunque esté colocado en un soporte?", options:["Sí, si no lo sujetas con la mano no hay problema","No, manipularlo también está sancionado","Sí, solo en semáforo en rojo"], answer:1},
    {type:"choice", q:"Ante los primeros síntomas de sueño al volante, lo correcto es…", options:["Subir el volumen de la música y seguir","Abrir la ventanilla y aguantar hasta el destino","Parar en un lugar seguro y descansar"], answer:2},
   ]},

 { title:"Cinturón, SRI y sistemas de seguridad pasiva", icon:"🎗️",
   explain:`<h3>Lo que te protege en una colisión</h3>
   <p>El <b>cinturón de seguridad</b> es obligatorio para el conductor y todos los ocupantes, delante y detrás, siempre que el vehículo lo tenga instalado.</p>
   <p>Los menores deben viajar en un <b>Sistema de Retención Infantil (SRI)</b> homologado y adecuado a su talla y peso; por debajo de 135 cm de estatura no pueden viajar con el cinturón de adultos solo.</p>
   <p>El <b>airbag</b> es un complemento al cinturón, no un sustituto: sin cinturón, el airbag puede incluso agravar las lesiones. Si un asiento trasero tiene airbag frontal activo, un SRI orientado hacia atrás no debe instalarse ahí salvo que el airbag esté desactivado.</p>`,
   example:{code:`Cinturón: obligatorio en todas las plazas equipadas\nSRI: obligatorio para menores de 135 cm\nAirbag: complementa al cinturón, no lo sustituye`, caption:"El cinturón reduce drásticamente el riesgo de lesión grave o muerte."},
   ex:[
    {type:"choice", img:"cinturon", q:"¿Es obligatorio llevarlo puesto en los asientos traseros?", options:["No, solo delante","Sí, en todas las plazas que dispongan de él","Solo en carretera, no en ciudad"], answer:1},
    {type:"choice", q:"Un menor de estatura inferior a 135 cm debe viajar…", options:["Con el cinturón de adultos, es suficiente","En un Sistema de Retención Infantil homologado","En brazos de un adulto sujeto con su cinturón"], answer:1},
    {type:"choice", q:"¿El airbag sustituye al cinturón de seguridad?", options:["Sí, con airbag no hace falta cinturón","No, es un complemento; sin cinturón puede ser incluso más peligroso","Solo lo sustituye en trayectos cortos"], answer:1},
   ]},

 { title:"Casco y otros equipos de protección", icon:"🪖",
   explain:`<h3>Quién debe llevarlo y cómo</h3>
   <p>El <b>casco</b> es obligatorio para conductores y pasajeros de motocicletas y ciclomotores, en todo tipo de vía, y debe estar homologado y correctamente abrochado (no solo puesto).</p>
   <p>Para los ciclistas, el casco es obligatorio en vías interurbanas, salvo excepciones (subidas prolongadas, condiciones médicas), y muy recomendable siempre, también en ciudad.</p>
   <p>Otros elementos como guantes, chaqueta o calzado adecuado no siempre son obligatorios por ley, pero reducen mucho la gravedad de las lesiones en caso de caída.</p>`,
   example:{code:`Casco obligatorio:\n- Motos y ciclomotores: siempre, todas las vías\n- Bicicletas: interurbanas (con excepciones)\nUn casco mal abrochado no protege igual que uno bien puesto.`, caption:"El casco debe llevarse correctamente abrochado, no solo puesto."},
   ex:[
    {type:"choice", img:"casco", q:"¿Es obligatorio llevar este elemento para el conductor de una motocicleta en ciudad?", options:["No, solo en carretera","Sí, en todo tipo de vía","Solo si supera los 45 km/h"], answer:1},
    {type:"choice", q:"Llevar el casco puesto pero sin abrochar…", options:["Cumple igualmente la normativa","No es correcto: debe ir bien abrochado para proteger","Solo es un problema en carretera"], answer:1},
    {type:"choice", q:"En general, ¿es obligatorio el casco para un ciclista en vías interurbanas?", options:["Sí, con algunas excepciones previstas","No, nunca es obligatorio para bicicletas","Solo para menores de edad"], answer:0},
   ]},

 { title:"Meteorología adversa y conducción nocturna", icon:"🌧️",
   explain:`<h3>Adapta la conducción a lo que ves (y a lo que no)</h3>
   <p>Con lluvia, niebla o nieve debes <b>reducir la velocidad</b> y aumentar la distancia de seguridad, ya que la adherencia y la visibilidad disminuyen. En niebla densa, usa las luces antiniebla si el vehículo las tiene.</p>
   <p>De noche, usa las <b>luces de cruce</b> en poblado y cuando circule otro vehículo de frente; las <b>luces de carretera</b> solo cuando no deslumbren a nadie, cambiando a cruce antes de cruzarte con otro vehículo o si vas detrás de otro.</p>
   <p>El <b>aquaplaning</b> (pérdida de contacto con el suelo por una capa de agua) se previene reduciendo la velocidad y manteniendo los neumáticos en buen estado.</p>`,
   example:{code:`Lluvia/niebla/nieve → reduce velocidad, más distancia\nNoche en poblado o con tráfico de frente → luces de cruce\nNoche sin tráfico próximo → luces de carretera (si no deslumbran)`, caption:"La prudencia ante el mal tiempo no es opcional: los límites de velocidad son el máximo, no un objetivo."},
   ex:[
    {type:"choice", q:"Con niebla densa, lo adecuado es…", options:["Mantener la velocidad habitual y las luces largas","Reducir la velocidad, aumentar distancia y usar antiniebla si las tienes","Apagar todas las luces para no deslumbrar"], answer:1},
    {type:"choice", img:"luzcarretera", q:"Circulando de noche con este tipo de luces, ¿cuándo debes cambiar a las de cruce?", options:["Nunca, las largas ayudan siempre","Antes de cruzarte con otro vehículo o si circulas detrás de otro","Solo al entrar en una autopista"], answer:1},
    {type:"choice", q:"El aquaplaning se previene principalmente…", options:["Acelerando para atravesar el agua rápido","Reduciendo la velocidad y con los neumáticos en buen estado","Frenando bruscamente al notarlo"], answer:1},
   ]},

 { title:"Documentación, seguro y carnet por puntos", icon:"📄",
   explain:`<h3>Lo que debes llevar y cómo funciona el saldo de puntos</h3>
   <p>Debes poder acreditar: el <b>permiso de conducir</b> en vigor, la <b>documentación del vehículo</b> (permiso de circulación, ficha técnica) y el <b>seguro obligatorio</b> vigente.</p>
   <p>El carnet por puntos empieza con <b>12 puntos</b> para un conductor con experiencia; los <b>conductores noveles</b> (los dos primeros años tras sacarse el carnet) comienzan con <b>8 puntos</b>, y pasan a 12 automáticamente si no cometen infracciones en ese periodo.</p>
   <p>Sin sanciones, el saldo puede crecer hasta un máximo de <b>15 puntos</b> (con el tiempo, en tramos de varios años). Un curso de sensibilización y reeducación vial permite recuperar hasta <b>6 puntos</b> perdidos.</p>`,
   example:{code:`Saldo de puntos del carnet:\nConductor novel (2 primeros años): 8 puntos\nConductor con experiencia:         12 puntos\nMáximo acumulable con el tiempo:    15 puntos\nCurso de recuperación:            hasta 6 puntos`, caption:"Estas cifras corresponden a la normativa vigente; compruébalas en dgt.es si ha pasado tiempo desde que estudiaste esto."},
   ex:[
    {type:"choice", q:"¿Con cuántos puntos empieza un conductor novel (primeros 2 años de carnet)?", options:["12 puntos","8 puntos","15 puntos"], answer:1},
    {type:"choice", q:"¿Cuál es el máximo de puntos que puede llegar a acumular un conductor con el tiempo, sin sanciones?", options:["12 puntos","15 puntos","20 puntos"], answer:1},
    {type:"choice", q:"Un curso de recuperación de puntos permite recuperar, como máximo…", options:["2 puntos","6 puntos","Todos los que se hayan perdido, sin límite"], answer:1},
   ]},

 { title:"Accidentes, baliza V16 y primeros auxilios", icon:"🚑",
   explain:`<h3>Qué hacer si te ocurre a ti (o lo ves)</h3>
   <p>Ante una avería o accidente que obligue a detenerte en la calzada o el arcén, desde el <b>1 de enero de 2026</b> es obligatorio señalizar el vehículo con la <b>baliza V16 conectada</b>, que sustituye a los triángulos: se enciende y coloca en el techo del vehículo <b>sin necesidad de bajarte</b> a la calzada, y transmite tu ubicación a la plataforma DGT 3.0 para avisar a otros conductores.</p>
   <p>Ante un accidente con heridos, el orden de actuación (PAS) es: <b>Proteger</b> la zona (señalizar, evitar más colisiones), <b>Avisar</b> a los servicios de emergencia (112), y <b>Socorrer</b> solo si sabes cómo hacerlo, sin mover a un herido salvo peligro inminente (incendio, explosión).</p>`,
   example:{code:`Orden de actuación ante un accidente (PAS):\nP — Proteger la zona\nA — Avisar al 112\nS — Socorrer (sin mover al herido salvo peligro inminente)\n\nBaliza V16: obligatoria desde el 1-1-2026, sustituye a los triángulos.`, caption:"La V16 se coloca sin bajarte del coche: reduce el riesgo de que te atropellen al señalizar."},
   ex:[
    {type:"choice", q:"Desde el 1 de enero de 2026, ¿qué elemento es obligatorio para señalizar una avería o accidente en carretera?", options:["Los triángulos de emergencia únicamente","La baliza V16 conectada","Encender solo los intermitentes"], answer:1},
    {type:"choice", q:"¿Cuál es el primer paso al llegar a un accidente con heridos?", options:["Mover a los heridos a un lugar cómodo","Proteger la zona para evitar más colisiones","Grabar la escena con el móvil"], answer:1},
    {type:"choice", q:"¿Se debe mover a una persona herida tras un accidente?", options:["Sí, siempre, para que esté más cómoda","No, salvo peligro inminente (fuego, explosión, etc.)","Sí, para hacerle un masaje de reanimación siempre"], answer:1},
   ]},

 { title:"Conducción eficiente y medio ambiente", icon:"🌱",
   explain:`<h3>Conducir mejor también es conducir más limpio</h3>
   <p>La <b>conducción eficiente</b> consiste en anticiparse al tráfico, mantener una velocidad estable, cambiar de marcha a bajas revoluciones y evitar acelerones y frenazos innecesarios: reduce el consumo, las emisiones y el desgaste del vehículo.</p>
   <p>Las <b>zonas de bajas emisiones (ZBE)</b> en muchas ciudades restringen el acceso según el distintivo ambiental del vehículo (etiqueta DGT: 0, ECO, C, B o sin etiqueta).</p>
   <p>Apagar el motor en paradas prolongadas, revisar la presión de los neumáticos y no sobrecargar el vehículo también reducen el consumo y las emisiones.</p>`,
   example:{code:`Claves de la conducción eficiente:\n- Anticípate al tráfico, evita frenazos y acelerones\n- Cambia de marcha a bajas revoluciones\n- Neumáticos a la presión correcta\n- Apaga el motor en paradas largas`, caption:"Conducir de forma eficiente también reduce el riesgo de accidente."},
   ex:[
    {type:"choice", q:"¿Qué caracteriza a la conducción eficiente?", options:["Acelerar y frenar con fuerza para llegar antes","Anticiparse, mantener velocidad estable y evitar frenazos","Circular siempre en punto muerto cuesta abajo"], answer:1},
    {type:"choice", img:"distintivoambiental", q:"Una pegatina como esta (distintivo ambiental) sirve para…", options:["Decorar el parabrisas","Regular el acceso a zonas de bajas emisiones según el vehículo","Indicar la velocidad máxima del vehículo"], answer:1},
    {type:"choice", q:"Una presión de neumáticos incorrecta…", options:["No afecta al consumo de combustible","Puede aumentar el consumo y reducir la seguridad","Solo afecta a la comodidad"], answer:1},
   ]},

 { title:"Mantenimiento básico del vehículo", icon:"🔧",
   explain:`<h3>Lo mínimo que debes revisar</h3>
   <p>Los <b>neumáticos</b> deben tener una profundidad de dibujo mínima legal de <b>1,6 mm</b> y presión adecuada; un neumático gastado o mal inflado aumenta la distancia de frenado y el riesgo de reventón.</p>
   <p>Las <b>luces</b> (cruce, freno, intermitentes) deben funcionar correctamente: son tu forma de "hablar" con el resto de conductores.</p>
   <p>Los <b>frenos</b> y los niveles de líquidos (aceite, refrigerante, líquido de frenos) deben revisarse periódicamente; el vehículo debe pasar la <b>ITV</b> (Inspección Técnica de Vehículos) según su antigüedad para poder circular legalmente.</p>`,
   example:{code:`Revisión básica periódica:\n- Neumáticos: dibujo ≥ 1,6 mm y presión correcta\n- Luces: todas operativas\n- Niveles de aceite, refrigerante y líquido de frenos\n- ITV en vigor`, caption:"Un vehículo mal mantenido es una fuente de riesgo tan real como una mala maniobra."},
   ex:[
    {type:"choice", img:"neumatico", q:"¿Cuál es la profundidad mínima legal del dibujo de un neumático?", options:["1,6 mm","3 mm","0,5 mm"], answer:0},
    {type:"choice", q:"¿Para qué sirve principalmente la ITV?", options:["Para poner multas","Para comprobar que el vehículo cumple los requisitos técnicos y de seguridad","Para cambiar la matrícula"], answer:1},
    {type:"choice", q:"Un neumático con poca presión, ¿qué provoca?", options:["Menor distancia de frenado","Mayor distancia de frenado y más riesgo de reventón","No afecta a la frenada, solo al confort"], answer:1},
   ]},

 { title:"Vehículos especiales y de movilidad personal (VMP)", icon:"🛴",
   explain:`<h3>Patinetes, quads y otros vehículos que no son ni coche ni moto</h3>
   <p>Los <b>Vehículos de Movilidad Personal (VMP)</b>, como los patinetes eléctricos, no pueden circular por autopistas, autovías, ni por travesías, aceras o zonas peatonales; su uso se limita a calzada urbana con límites bajos de velocidad, calles ciclistas y, cuando existan, carriles bici. Necesitan al menos un timbre y luces si circulan de noche, pero no requieren permiso de conducir ni seguro obligatorio (aunque se recomienda).</p>
   <p>Los <b>vehículos especiales</b> (tractores, maquinaria agrícola, quads) tienen límites de velocidad reducidos y, en algunos casos, deben señalizarse con paneles reflectantes.</p>
   <p>Ningún VMP puede transportar más de una persona ni ir enganchado a otro vehículo.</p>`,
   example:{code:`${signBadge('vmp','VMP (patinete eléctrico)')}`, caption:"Los VMP no pueden circular por aceras, travesías, autopistas ni autovías."},
   ex:[
    {type:"choice", img:"vmp", q:"¿Puede circular un patinete eléctrico (VMP) por la acera?", options:["Sí, si va despacio","No, está prohibido","Sí, solo de noche"], answer:1},
    {type:"choice", q:"¿Necesita permiso de conducir un Vehículo de Movilidad Personal (VMP)?", options:["Sí, cualquiera de las categorías de moto","No, actualmente no lo exige la normativa","Solo si supera los 25 km/h"], answer:1},
    {type:"choice", q:"¿Puede un VMP circular por autopistas o autovías?", options:["Sí, si el conductor lleva casco","No, tiene prohibido el acceso","Sí, solo por el arcén"], answer:1},
   ]},

 { title:"Peatones y ciclistas: usuarios vulnerables", icon:"🚶",
   explain:`<h3>Compartir la vía con quien no lleva carrocería</h3>
   <p>Los peatones deben circular por las aceras o zonas peatonales; si no existen, por el arcén o borde de la calzada contrario al sentido de la marcha (de frente al tráfico), para verlo llegar. Deben cruzar por los pasos de peatones cuando los haya cerca.</p>
   <p>El conductor debe extremar la precaución cerca de colegios, pasos de peatones y zonas con niños, personas mayores o con movilidad reducida, y <b>ceder siempre el paso</b> a un peatón que ya ha empezado a cruzar correctamente.</p>
   <p>Con los <b>ciclistas</b>, la distancia lateral mínima al adelantar es de <b>1,5 metros</b> en vías convencionales, e incluso puedes invadir el carril contrario si es seguro para respetarla. Los ciclistas pueden circular en paralelo (dos en fila) en vías interurbanas si no entorpecen la circulación.</p>`,
   example:{code:`${signBadge('pasopeaton','Paso de peatones')}`, caption:"Un peatón cruzando correctamente siempre tiene prioridad."},
   ex:[
    {type:"choice", img:"pasopeaton", q:"Si un peatón ya ha empezado a cruzar correctamente por aquí, el conductor debe…", options:["Acelerar para pasar antes de que llegue","Cederle el paso","Tocar el claxon para que se dé prisa"], answer:1},
    {type:"choice", q:"¿Cuál es la distancia lateral mínima recomendada al adelantar a un ciclista en vía convencional?", options:["0,5 metros","1,5 metros","3 metros"], answer:1},
    {type:"choice", q:"Si no hay acera, ¿por dónde debe circular un peatón?", options:["Por el centro de la calzada","Por el arcén o borde de la calzada, de frente al tráfico","Por donde le resulte más cómodo"], answer:1},
   ]},

 { title:"Mandos, visibilidad e iluminación del vehículo", icon:"🕹️",
   explain:`<h3>Conocer los mandos antes de arrancar</h3>
   <p>Antes de salir, ajusta el asiento, los retrovisores (interior y laterales) y el reposacabezas: un reposacabezas mal ajustado agrava las lesiones cervicales en un alcance por detrás.</p>
   <p>Los <b>testigos del cuadro de mandos</b> te avisan de averías: un testigo en ámbar suele admitir seguir circulando con precaución (revisar pronto), mientras que uno en rojo exige detenerse en cuanto sea seguro.</p>
   <p>Tipos de luces: posición, cruce (de uso habitual de noche), carretera (sin tráfico cercano), antiniebla, intermitentes, freno y marcha atrás. Debes revisar que todas funcionen correctamente.</p>`,
   example:{code:`${signBadge('testigomotor','Testigo de avería del motor')}${signBadge('testigofreno','Testigo del sistema de frenos')}${signBadge('testigobateria','Testigo de la batería')}`, caption:"Un testigo en rojo exige detenerse en cuanto sea seguro; en ámbar, revisar pronto."},
   ex:[
    {type:"choice", img:"testigofreno", q:"Si se enciende este testigo (rojo) mientras conduces, debes…", options:["Ignorarlo si el coche frena con normalidad","Detenerte en cuanto sea seguro y revisarlo","Esperar a la próxima ITV"], answer:1},
    {type:"choice", q:"Un reposacabezas mal ajustado…", options:["No influye en nada","Agrava las lesiones cervicales en un alcance por detrás","Solo afecta a la comodidad"], answer:1},
    {type:"choice", q:"¿Qué luces se usan habitualmente de noche cuando circula tráfico en sentido contrario?", options:["Luces de carretera","Luces de cruce","Luces antiniebla traseras"], answer:1},
   ]},

 { title:"Requisitos para conducir y distintivos del vehículo", icon:"🪪",

function testPoolForTrack(track){
  return TEST_POOL_COMMON.concat(track==="moto" ? TEST_POOL_MOTO_EXTRA : TEST_POOL_COCHE_EXTRA);
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleQuestion(q){
  const order = shuffle(q.options.map((o,i)=>i));
  return { q:q.q, options: order.map(i=>q.options[i]), answer: order.indexOf(q.answer), explain:q.explain, img:q.img };
}
// Test del apartado "Test": n preguntas aleatorias (sin repetir) del banco del track activo.
function buildTest(n){
  const pool = shuffle(testPoolForTrack(S.track));
  return pool.slice(0, Math.min(n, pool.length)).map(shuffleQuestion);
}
// Test de nivel inicial (onboarding): 6 preguntas, 2 de cada tier, solo del banco común.
function buildPlacementQuiz(){
  const tiers=[1,2,3];
  let picked=[];
  tiers.forEach(tier=>{
    const pool = shuffle(TEST_POOL_COMMON.filter(q=>q.tier===tier));
    picked = picked.concat(pool.slice(0,2));
  });
  return shuffle(picked).map(shuffleQuestion);
}
function lessonIndexByTitle(title){ const i=LESSONS.findIndex(l=>l.title===title); return i===-1?0:i; }
function placementLessonIndex(correct){
  if(correct<=1) return 0;
  if(correct<=3) return lessonIndexByTitle("Límites de velocidad");
  if(correct<=5) return lessonIndexByTitle("Cinturón, SRI y sistemas de seguridad pasiva");
  return LESSONS_COMMON.length; // acierta todo lo común: aun así debe hacer las lecciones específicas de su track
}
function placementLabel(correct){
  if(correct<=1) return "Principiante";
  if(correct<=3) return "Intermedio-bajo";
  if(correct<=5) return "Intermedio";
  return "Avanzado";
}
// Umbral de aprobado de un test: máx. 1 fallo por cada 10 preguntas (igual proporción que el examen oficial de 30 con máx. 3 fallos).
function maxErrorsAllowed(n){ return Math.max(1, Math.round(n*0.1)); }

const app = document.getElementById("app");
const nav = document.getElementById("nav");

function render(){
  refreshLives();
  document.getElementById("phone").classList.toggle("dark", S.dark);
  document.getElementById("phone").classList.toggle("gold", S.goldActive);
  if(S.screen==="login"){ nav.classList.add("hidden"); app.innerHTML=viewLogin(); bindLogin(); return; }
  nav.classList.remove("hidden");
  nav.innerHTML = viewNav();
  bindNav();
  if(S.tab==="home") app.innerHTML=viewHome();
  else if(S.tab==="test") app.innerHTML=viewTest();
  else if(S.tab==="shop") app.innerHTML=viewShop();
  else if(S.tab==="social") app.innerHTML=viewSocial();
  else if(S.tab==="profile") app.innerHTML=viewProfile();
  bindTabPage();
  if(S.tab==="social") bindSocial();
  app.scrollTop=0;
}

let currentQuiz=[], quizIndex=0, quizAnswers=[];
function showConfirm(container, {icon:ic="⚠️", title, desc, okLabel, okColor="var(--bad)", onOk}){

function confirmLeaveQuiz(onConfirm){

function renderQuiz(){
  const q = currentQuiz[quizIndex];
  const dots = currentQuiz.map((_,i)=>`<span class="ob-dot ${i===quizIndex?'active':''}"></span>`).join("");
  const already = quizAnswers[quizIndex];
  onboardingEl.innerHTML = `
    <div class="ob-top-row"><button class="ob-back" id="quizBack">${icon('chevronleft')}</button><span></span></div>
    <div class="ob-body" style="justify-content:flex-start;padding-top:10px">

      <h2 style="text-align:left;align-self:flex-start;margin-bottom:20px;font-size:19px">${escapeHtml(q.q)}</h2>
      <div class="opts" style="width:100%">
        ${q.options.map((o,i)=>`<button class="opt ${already===i?'sel':''}" style="font-family:'Poppins',sans-serif;font-weight:600" data-i="${i}">${escapeHtml(o)}</button>`).join("")}
      </div>
    </div>
    <div class="ob-foot">
      <div class="ob-dots">${dots}</div>
      <button class="btn btn-primary" id="quizNext" ${already===null?'disabled':''}>${quizIndex<currentQuiz.length-1?'Siguiente':'Ver resultado'}</button>
    </div>`;
  onboardingEl.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    onboardingEl.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    o.classList.add("sel"); quizAnswers[quizIndex]=+o.dataset.i;
    document.getElementById("quizNext").disabled=false;
  });
  document.getElementById("quizBack").onclick=()=>{
    if(quizIndex>0){ quizIndex--; renderQuiz(); }
    else { confirmLeaveQuiz(()=>{ obIndex=0; renderOnboarding(); }); }
  };
  document.getElementById("quizNext").onclick=()=>{
    if(quizIndex<currentQuiz.length-1){ quizIndex++; renderQuiz(); }
    else renderQuizResult();
  };

function lessonReward(i){ const n=LESSONS[i].ex.length; return { xp:n*25+30, gems:n*5+10 }; }
function renderQuizResult(){
  const quizCorrect = quizAnswers.reduce((sum,ans,i)=> sum + (ans===currentQuiz[i].answer?1:0), 0);
  const label = placementLabel(quizCorrect);
  const idx = placementLessonIndex(quizCorrect);
  let bonusXp=0, bonusGems=0;
  for(let i=0;i<idx;i++){ const r=lessonReward(i); bonusXp+=r.xp; bonusGems+=r.gems; }
  const startName = idx < LESSONS.length ? LESSONS[idx].title : LESSONS[LESSONS.length-1].title;
  const desc = `Acertaste ${quizCorrect} de ${currentQuiz.length} preguntas. ${idx>0?`Hemos desbloqueado las lecciones que ya dominas — empezarás en "${startName}".`:`Empezarás desde el principio, paso a paso.`}`;
  onboardingEl.innerHTML = `
    <div class="ob-body">
      <div class="ob-icon">🎯</div>
      <h2>¡Tu nivel es: ${label}!</h2>
      <p>${desc}</p>
      ${idx>0?`<p style="color:var(--violet);font-weight:700;margin-top:8px">Además, ¡has ganado +${bonusXp} XP y +${bonusGems} 💎 por las lecciones que ya dominabas!</p>`:``}
    </div>
    <div class="ob-foot"><button class="btn btn-primary" id="applyPlacement">Continuar</button></div>`;
  document.getElementById("applyPlacement").onclick=()=>{
    S.level = label;
    for(let i=0;i<idx;i++){ completed()[i]=true; }
    S.xp += bonusXp; S.diamonds += bonusGems;
    finishOnboarding();
  };
}
function finishOnboarding(){
  S.onboarded=true; S.onboardedTracks[S.track]=true; save();
  onboardingEl.classList.remove("open");
  render();
}

function bindLogin(){

      const name=uInput.value.trim().toLowerCase();
      if(!name){ uMsg.textContent=""; return; }
      if(!/^[a-z0-9_]{3,16}$/.test(name)){ uMsg.textContent="3-16 caracteres: letras, números y guion bajo"; uMsg.className="field-msg bad"; return; }
      const accs=loadAccounts();
      if(accs[name]){ uMsg.textContent="Ese nombre de usuario ya está cogido"; uMsg.className="field-msg bad"; }
      else { uMsg.textContent="Nombre de usuario disponible"; uMsg.className="field-msg ok"; }
    };
  }
  document.getElementById("enter").onclick=()=>{
    const nameRaw=uInput.value.trim();
    const name=nameRaw.toLowerCase();
    const pass=document.getElementById("p").value;
    const accs=loadAccounts();
    if(authMode==="signup"){
      if(!/^[a-z0-9_]{3,16}$/.test(name)){ toast("3-16 caracteres: letras, números y guion bajo"); return; }
      if(accs[name]){ toast("Ese nombre de usuario ya está cogido"); return; }
      if(pass.length<4){ toast("La contraseña debe tener al menos 4 caracteres"); return; }
      accs[name]={username:nameRaw, password:pass, displayName:nameRaw, friendCode:makeFriendCode(), avatarColor:"#2F6FED", provider:"local", createdAt:Date.now()};
      saveAccounts(accs);
      logInAs(name);
    } else {
      if(!accs[name] || accs[name].provider==="npc" || accs[name].password!==pass){ toast("Usuario o contraseña incorrectos"); return; }
      logInAs(name);
    }
  };
  document.getElementById("eye").onclick=()=>{ const p=document.getElementById("p"); p.type=p.type==="password"?"text":"password"; };
}
function logInAs(usernameKey){
  const accs=loadAccounts();
  const acc=accs[usernameKey];
  const existing = loadState(usernameKey);
  S = migrateState(Object.assign(freshState(), existing||{}));
  S.username = usernameKey;
  S.user = acc.displayName || acc.username;
  S.screen="home"; S.tab="home";
  setTrack(S.track);
  try{ localStorage.setItem(SESSION_KEY, usernameKey); }catch(e){}
  save();
  if(!S.onboarded){ openOnboarding(); } else { render(); }
}

/* ---------- LECCIÓN ("Aprende") ---------- */
const lessonScreen = document.getElementById("lessonScreen");
function getLesson(idx){ return idx==="review" ? S._reviewLesson : LESSONS[idx]; }
function openLesson(i){
  S.activeLesson=i; S.exIndex=-1; S.sessionXp=0; S.sessionGems=0;
  renderLessonIntro();
  lessonScreen.classList.add("open");
}
function getReviewPool(){
  let pool=[];
  LESSONS.forEach((l,i)=>{ if(completed()[i] && l.ex){ l.ex.forEach(ex=>pool.push(ex)); } });
  return pool;
}
function openReview(){
  const pool = shuffle(getReviewPool()).slice(0,5);
  if(pool.length===0) return;
  S._reviewLesson = {
    title:"Repaso", icon:"🔁",
    explain:`<h3>Repaso espaciado</h3><p>Una mezcla rápida de ejercicios de lecciones que ya has completado, para que las normas se te queden en la memoria a largo plazo.</p>`,
    example:null, ex: pool,
  };
  S.activeLesson="review"; S.exIndex=-1; S.sessionXp=0; S.sessionGems=0;
  renderLessonIntro();
  lessonScreen.classList.add("open");
}
function closeLesson(){ lessonScreen.classList.remove("open"); setTimeout(()=>lessonScreen.innerHTML="",350); }
function lessonProgress(){ const L_=getLesson(S.activeLesson); const total=L_.ex.length+1; const done=S.exIndex+1; return Math.round(done/total*100); }
function renderLessonIntro(){
  const L_=getLesson(S.activeLesson);
  const numberLabel = (S.activeLesson==="review") ? "" : `${S.activeLesson+1}. `;
  const hasExample = !!L_.example;
  lessonScreen.innerHTML=`
   <div class="lesson-top"><button class="x" id="lx">✕</button><h2>${numberLabel}${L_.title}</h2></div>
   <div class="lesson-bar"><span style="width:8%"></span></div>
   <div class="lesson-body">
     <div class="tabs"><button class="tab active" id="tabE">Explicación</button>${hasExample?`<button class="tab" id="tabX">Ejemplo</button>`:``}</div>
     <div id="tabContent">${L_.explain}</div>
   </div>
   <div class="lesson-foot"><button class="btn btn-primary" id="cont">Continuar</button></div>`;
  document.getElementById("lx").onclick=closeLesson;
  if(hasExample){
    const showExplain=()=>{document.getElementById("tabContent").innerHTML=L_.explain;tabE.classList.add("active");tabX.classList.remove("active");};
    const showExample=()=>{document.getElementById("tabContent").innerHTML=`<h3>Ejemplo</h3><div class="code">${L_.example.code}</div><p class="caption">${L_.example.caption}</p>`;tabX.classList.add("active");tabE.classList.remove("active");};
    const tabE=document.getElementById("tabE"), tabX=document.getElementById("tabX");
    tabE.onclick=showExplain; tabX.onclick=showExample;
  }
  document.getElementById("cont").onclick=()=>{ S.exIndex=0; renderExercise(); };
}
function renderExercise(){
  const L_=getLesson(S.activeLesson); const ex=L_.ex[S.exIndex]; S.exStartTime=Date.now();
  lessonScreen.innerHTML=`
   <div class="lesson-top"><button class="x" id="lx">✕</button><h2>${S.activeLesson==="review"?"Repaso":(S.activeLesson+1)+". "+L_.title}</h2></div>
   <div class="lesson-bar"><span style="width:${lessonProgress()}%"></span></div>
   <div class="lesson-body">
     <div class="q-kicker">Ejercicio ${S.exIndex+1} / ${L_.ex.length}</div>
     ${ex.img?`<div class="qimg">${signSvg(ex.img)}</div>`:``}
     <div class="q-text">${ex.q}</div>
     <div class="opts">${ex.options.map((o,i)=>`<button class="opt" data-i="${i}">${escapeHtml(o)}</button>`).join("")}</div>
     <div class="feedback" id="fb"></div>
   </div>
   <div class="lesson-foot"><button class="btn btn-primary" id="check" disabled>Comprobar</button></div>`;
  document.getElementById("lx").onclick=closeLesson;
  const check=document.getElementById("check");
  let picked=null, answered=false;
  lessonScreen.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    if(answered) return;
    lessonScreen.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    o.classList.add("sel"); picked=+o.dataset.i; check.disabled=false;
  });
  check.onclick=()=>{
    if(answered){ next(); return; }
    refreshLives();
    if(S.lives<=0){ toast("No te quedan vidas. Vuelve mañana o compra una en la tienda."); return; }
    answered=true;
    const secs=(Date.now()-S.exStartTime)/1000;
    const fb=document.getElementById("fb");
    const correct = picked===ex.answer;
    lessonScreen.querySelectorAll(".opt").forEach((o,i)=>{
      o.style.pointerEvents="none";
      if(i===ex.answer) o.classList.add("correct");
      else if(i===picked) o.classList.add("wrong");
    });
    finishExerciseFeedback(correct, secs, fb, ex.explain);
    check.textContent = (S.exIndex < L_.ex.length-1) ? "Continuar" : "Finalizar";
  };
  function finishExerciseFeedback(correct, secs, fb, explainNote){
    let gain=0, gems=0;
    if(correct){
      const speedBonus = Math.max(0, Math.round(15 - secs));
      gain = 20 + speedBonus; gems = 5;
      fb.classList.add("show","ok");
      fb.innerHTML = `<div class="fb-row">${icon('check')} <span>¡Correcto! +${gain} XP · +${gems} 💎 ${speedBonus>0?`<span style="opacity:.8">(bonus velocidad +${speedBonus})</span>`:``}</span></div>`;
      floatXp("+"+gain+" XP");
    }else{
      const hasLives=loseLife();
      fb.classList.add("show","no");
      const lifeNote=hasLives?`<span>❤️ -1 · ${S.lives}/${S.maxLives||5}</span>`:`<span>Sin vidas: vuelve mañana o compra una en la tienda.</span>`;
      fb.innerHTML = `<div class="fb-row"><span>❌ No es correcto.</span> ${lifeNote}</div>`;
      if(explainNote) fb.innerHTML += `<div style="margin-top:8px;font-weight:500;opacity:.85;font-size:12.5px">${explainNote}</div>`;
    }
    S.sessionXp+=gain; S.sessionGems+=gems;
  }
  function next(){ if(S.exIndex < L_.ex.length-1){ S.exIndex++; renderExercise(); } else finishLesson(); }
}
function finishLesson(){
  const isReview = S.activeLesson==="review";
  const L_=getLesson(S.activeLesson);
  let bonus=0, gemBonus=0, wasNew=false;
  if(!isReview){
    wasNew = !completed()[S.activeLesson];
    completed()[S.activeLesson]=true;
    bonus = wasNew?30:0; gemBonus = wasNew?10:0;
  }
  S.xp += S.sessionXp + bonus;
  S.diamonds += S.sessionGems + gemBonus;
  recordPractice();
  save();
  const finishedMsg = isReview ? "Has repasado 5 ejercicios de lecciones que ya habías completado." : `Has terminado "${L_.title}".`;
  lessonScreen.innerHTML=`
   <div class="lesson-top"><button class="x" id="lx">✕</button><h2>Lección completada</h2></div>
   <div class="lesson-bar"><span style="width:100%"></span></div>
   <div class="lesson-body">
     <div class="complete">
       <div class="medal">${isReview?'🔁':'🎉'}</div>
       <h2>¡Bien hecho, ${S.user}!</h2>
       <div class="sub">${finishedMsg}</div>
       <div class="rewards">
         <div class="reward"><div class="v" style="color:var(--violet)">+${S.sessionXp+bonus}</div><div class="l">XP conseguidos</div></div>
         <div class="reward"><div class="v" style="color:var(--gold)">+${S.sessionGems+gemBonus}</div><div class="l">💎 Diamantes</div></div>
       </div>
     </div>
   </div>
   <div class="lesson-foot"><button class="btn btn-primary" id="done">Continuar</button></div>`;
  document.getElementById("lx").onclick=()=>{closeLesson();render();};
  document.getElementById("done").onclick=()=>{closeLesson();S.tab="home";render();};
}

/* ---------- TEST (exámenes tipo DGT, configurables) ---------- */
function viewTest(){
  const lens=[10,20,30];
  const cards = lens.map(n=>{
    const hist = (S.testHistory[S.track]||{})[String(n)];
    const err = maxErrorsAllowed(n);
    const label = n===30?"Simulacro oficial (30)":n===20?"Test medio (20)":"Test rápido (10)";
    const emoji = n===30?"🎓":n===20?"📝":"⚡";
    const badge = hist ? `<div class="badge ${hist.best.passed?'pass':'fail'}">Mejor: ${hist.best.correct}/${hist.best.total} ${hist.best.passed?'· Aprobado':'· No apto'}</div>` : '';
    return `<div class="shop-item">
      <div class="shop-emoji">${emoji}</div>
      <div class="shop-info"><div class="t">${label}</div><div class="d">Máx. ${err} fallo${err>1?'s':''} para aprobar</div>${badge}</div>
      <button class="buy" data-starttest="${n}">Empezar</button>
    </div>`;
  }).join("");
  return `<div class="page"><h1>Test</h1>
    <div class="lead">Practica exactamente como el examen oficial de la DGT (carnet ${S.track==="moto"?"A, moto":"B, coche"}): 3 opciones de respuesta por pregunta (a, b, c) y preguntas con imagen, igual que el examen real. Elige cuántas preguntas quieres hacer.</div>
    ${cards}
    <div class="disclaimer-note" style="padding:14px 0 0;text-align:left">⚠️ El simulacro oficial (30 preguntas) añade un cronómetro de 30 minutos, como en el examen real. Contenido educativo para practicar: no sustituye el temario oficial de tu autoescuela ni garantiza aprobar el examen real; comprueba siempre la normativa vigente en dgt.es.</div>
  </div>`;
}
let currentTest=[], testIndex=0, testAnswers=[], testN=10, testDeadline=null, testTimerInt=null;
function openTest(n){
  currentTest = buildTest(n); testIndex=0; testAnswers=new Array(currentTest.length).fill(null); testN=n;
  testDeadline = n===30 ? (Date.now()+30*60*1000) : null;
  renderTestQuestion();
  lessonScreen.classList.add("open");
}
function stopTestTimer(){ if(testTimerInt){ clearInterval(testTimerInt); testTimerInt=null; } }
function confirmLeaveTest(onConfirm){
  showConfirm(lessonScreen, { title:"¿Salir del test?", desc:"Perderás las respuestas de este intento y no se guardará el resultado.", okLabel:"Sí, salir", onOk:onConfirm });
}
function renderTestQuestion(){
  const q=currentTest[testIndex];
  const already=testAnswers[testIndex];
  const timerHtml = testDeadline ? `<span id="tTimer" style="margin-left:auto;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--violet);white-space:nowrap">⏱ 30:00</span>` : ``;
  lessonScreen.innerHTML=`
   <div class="lesson-top"><button class="x" id="lx">✕</button><h2>Test de ${testN} preguntas</h2>${timerHtml}</div>
   <div class="lesson-bar"><span style="width:${Math.round(testIndex/currentTest.length*100)}%"></span></div>
   <div class="lesson-body">
     <div class="q-kicker">Pregunta ${testIndex+1} / ${currentTest.length} · 3 opciones (a, b, c)</div>
     ${q.img?`<div class="qimg">${signSvg(q.img)}</div>`:``}
     <div class="q-text">${escapeHtml(q.q)}</div>
     <div class="opts">${q.options.map((o,i)=>`<button class="opt ${already===i?'sel':''}" data-i="${i}">${escapeHtml(o)}</button>`).join("")}</div>
   </div>
   <div class="lesson-foot" style="display:flex;gap:10px">
     ${testIndex>0?`<button class="btn btn-ghost" id="tBack" style="flex:1">Atrás</button>`:``}
     <button class="btn btn-primary" id="tNext" style="flex:2" ${already===null?'disabled':''}>${testIndex<currentTest.length-1?'Siguiente':'Ver resultado'}</button>
   </div>`;
  document.getElementById("lx").onclick=()=>confirmLeaveTest(()=>{stopTestTimer();closeLesson();render();});
  lessonScreen.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    lessonScreen.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    o.classList.add("sel"); testAnswers[testIndex]=+o.dataset.i;
    document.getElementById("tNext").disabled=false;
  });
  const back=document.getElementById("tBack");
  if(back) back.onclick=()=>{ testIndex--; renderTestQuestion(); };
  document.getElementById("tNext").onclick=()=>{
    if(testIndex<currentTest.length-1){ testIndex++; renderTestQuestion(); }
    else { stopTestTimer(); renderTestResult(); }
  };
  stopTestTimer();
  if(testDeadline){
    const tick=()=>{
      const remain=testDeadline-Date.now();
      const elTimer=document.getElementById("tTimer");
      if(remain<=0){
        stopTestTimer();
        if(elTimer) elTimer.textContent="⏱ 0:00";
        toast("Tiempo agotado. Se entrega el test con las respuestas dadas.");
        renderTestResult();
        return;
      }
      if(elTimer){
        const m=Math.floor(remain/60000), s=Math.floor((remain%60000)/1000);
        elTimer.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
      }
    };
    tick();
    testTimerInt=setInterval(tick,1000);
  }
}
function renderTestResult(){
  stopTestTimer();
  const total=currentTest.length;
  const correctCount = testAnswers.reduce((sum,ans,i)=> sum+(ans===currentTest[i].answer?1:0),0);
  const maxErr = maxErrorsAllowed(total);
  const errors = total-correctCount;
  const passed = errors<=maxErr;
  S.testHistory[S.track] = S.testHistory[S.track]||{};
  const key=String(total);
  const prevBest = S.testHistory[S.track][key] && S.testHistory[S.track][key].best;
  const rec = {correct:correctCount, total, passed};
  S.testHistory[S.track][key] = { last:rec, best:(!prevBest || correctCount>prevBest.correct) ? rec : prevBest };
  recordPractice();
  save();
  const reviewHtml = currentTest.map((q,i)=>{
    const your=testAnswers[i]; const ok=your===q.answer;
    return `<div class="reviewq ${ok?'ok':'no'}">
      <div class="rq-top">${ok?'✔ Correcta':'✘ Incorrecta'}</div>
      ${q.img?`<div class="qimg small">${signSvg(q.img)}</div>`:``}
      <div class="rq-q">${escapeHtml(q.q)}</div>
      ${!ok?`<div class="rq-a your">Tu respuesta: ${escapeHtml(your===null?"(sin responder)":q.options[your])}</div>`:``}
      <div class="rq-a correct">Correcta: ${escapeHtml(q.options[q.answer])}</div>
      ${q.explain?`<div class="rq-exp">${escapeHtml(q.explain)}</div>`:``}
    </div>`;
  }).join("");
  lessonScreen.innerHTML=`
   <div class="lesson-top"><button class="x" id="lx">✕</button><h2>Resultado del test</h2></div>
   <div class="lesson-bar"><span style="width:100%"></span></div>
   <div class="lesson-body">
     <div class="complete" style="padding-top:16px;padding-bottom:10px">
       <div class="medal">${passed?'🎉':'📚'}</div>
       <h2>${passed?'¡Aprobado!':'Sigue practicando'}</h2>
       <div class="sub">${correctCount} de ${total} correctas · fallos permitidos: ${maxErr}</div>
     </div>
     <div style="text-align:left">
       <h3 style="font-size:15px;margin-bottom:10px">Revisión de preguntas</h3>
       ${reviewHtml}
     </div>
   </div>
   <div class="lesson-foot"><button class="btn btn-primary" id="doneTest">Continuar</button></div>`;
  document.getElementById("lx").onclick=finish;
  document.getElementById("doneTest").onclick=finish;
  function finish(){ closeLesson(); S.tab="test"; render(); }
}

/* ---------- TIENDA ---------- */
const SHOP=[
  {id:"dark", emoji:"🌙", t:"Tema oscuro", d:"Dale a Condufy un look oscuro y elegante.", cost:40},
  {id:"life", emoji:"❤️", t:"Recupera un corazón", d:"Sigue practicando hoy. El siguiente corazón costará un poco más."},
  {id:"freeze", emoji:"🧊", t:"Congelar racha", d:"Sáltate un día sin perder tu racha.", cost:30},
  {id:"gold", emoji:"⚡", t:"Tema dorado", d:"Un estilo premium con acentos dorados.", cost:120},
];
function viewShop(){
  const items=SHOP.map(it=>{
    const price=it.id==="life"?S.nextLifeCost:it.cost;
    let right;
    if(it.id==="dark" && S.theme_dark_owned) right=`<span class="owned">${icon('check')} Comprado</span>`;
    else if(it.id==="gold" && S.theme_gold_owned) right=`<span class="owned">${icon('check')} Comprado</span>`;
    else right=`<button class="buy" data-buy="${it.id}" data-cost="${price}" ${(it.id==="life"&&S.lives>=S.maxLives)||S.diamonds<price?'disabled':''}><span class="coin"></span>${price}</button>`;
    return `<div class="shop-item"><div class="shop-emoji">${it.emoji}</div>
      <div class="shop-info"><div class="t">${it.t}</div><div class="d">${it.d}</div></div>${right}</div>`;
  }).join("");
  return `<div class="page"><h1>Tienda</h1><div class="lead">Gasta los diamantes que ganas en las lecciones y los tests.</div>
    <div class="wallet"><span class="coin"></span> ${S.diamonds} diamantes</div>${items}</div>`;
}
function buy(id,cost,btn){
  if(S.diamonds<cost){ toast("No tienes suficientes diamantes"); return; }
  S.diamonds-=cost;
  if(id==="dark"){ S.theme_dark_owned=true; S.dark=true; toast("Modo oscuro desbloqueado 🌙"); }
  else if(id==="life"){ S.lives=Math.min(S.maxLives||5,S.lives+1); S.nextLifeCost=Math.ceil((S.nextLifeCost||20)*1.25/5)*5; toast(`Corazón recuperado ❤️ El próximo cuesta ${S.nextLifeCost} 💎`); }
  else if(id==="freeze"){ S.freezes++; toast(`Congelador de racha añadido 🧊 (tienes ${S.freezes})`); }
  else if(id==="gold"){ S.theme_gold_owned=true; S.goldActive=true; toast("Tema dorado aplicado ⚡"); }
  save(); render();
}

/* ---------- AMIGOS / clasificación ---------- */
function friendXp(usernameKey, accs){
  const acc = accs[usernameKey]; if(!acc) return 0;
  if(acc.demoXp!==undefined) return acc.demoXp;
  const st = loadState(usernameKey);
  return st ? (st.xp||0) : 0;
}
function viewSocial(){
  const accs=loadAccounts();
  const list = (S.friends||[]).filter(u=>accs[u]).map(u=>({
    n: accs[u].displayName||accs[u].username, xp: friendXp(u,accs), c: accs[u].avatarColor||"#2F6FED",
  }));
  list.push({n:S.user, xp:S.xp, c:"#2F6FED", me:true});
  list.sort((a,b)=>b.xp-a.xp);
  const rows=list.map((f,i)=>`<div class="lb-row ${f.me?'me':''}">
    <div class="lb-rank">${i+1}</div>
    <div class="lb-av" style="background:${f.c}">${f.n[0].toUpperCase()}</div>
    <div class="lb-name">${f.n}${f.me?' (tú)':''}</div>
    <div class="lb-xp">${f.xp} XP</div></div>`).join("");
  const myCode = S.username && accs[S.username] ? accs[S.username].friendCode : "";
  return `<div class="page"><h1>Amigos</h1><div class="lead">Clasificación de esta semana.</div>
    <button class="btn btn-ghost" id="openAddFriend" style="margin-bottom:14px">+ Añadir amigo</button>
    <div id="addFriendBox"></div>
    <div class="my-code">Tu código de amigo: <b>${myCode}</b></div>
    ${rows}</div>`;
}
function bindSocial(){
  const btn=document.getElementById("openAddFriend");
  if(!btn) return;
  btn.onclick=()=>{
    const box=document.getElementById("addFriendBox");
    box.innerHTML=`<div class="add-friend-box">
      <input id="friendSearch" class="type-in" style="font-family:inherit;border:2px solid var(--line);border-radius:15px;padding:15px 18px;width:100%;background:var(--code-bg);color:var(--ink)" placeholder="Usuario o código de amigo">
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn btn-primary" id="doSearch" style="flex:1">Buscar</button>
        <button class="btn btn-ghost" id="cancelSearch" style="flex:1">Cancelar</button>
      </div>
      <div id="searchResult"></div>
    </div>`;
    document.getElementById("cancelSearch").onclick=()=>{ box.innerHTML=""; };
    document.getElementById("doSearch").onclick=()=>{
      const q=document.getElementById("friendSearch").value.trim().toLowerCase();
      const resEl=document.getElementById("searchResult");
      if(!q){ return; }
      const accs=loadAccounts();
      let foundKey=null;
      for(const key in accs){ if(key===q || (accs[key].friendCode||"").toLowerCase()===q){ foundKey=key; break; } }
      if(!foundKey){ resEl.innerHTML=`<div class="field-msg bad" style="margin-top:10px">No se ha encontrado ningún usuario con ese nombre o código</div>`; return; }
      if(foundKey===S.username){ resEl.innerHTML=`<div class="field-msg bad" style="margin-top:10px">Esa es tu propia cuenta</div>`; return; }
      if((S.friends||[]).includes(foundKey)){ resEl.innerHTML=`<div class="field-msg bad" style="margin-top:10px">Ya sois amigos</div>`; return; }
      const acc=accs[foundKey];
      resEl.innerHTML=`<div class="shop-item" style="margin-top:10px">
        <div class="shop-emoji" style="background:${acc.avatarColor||'#2F6FED'};color:#fff;font-weight:800">${(acc.displayName||acc.username)[0].toUpperCase()}</div>
        <div class="shop-info"><div class="t">${acc.displayName||acc.username}</div></div>
        <button class="buy" id="confirmAdd">Añadir amigo</button></div>`;
      document.getElementById("confirmAdd").onclick=()=>{
        S.friends = S.friends||[]; S.friends.push(foundKey); save();
        toast("¡Amigo añadido!"); box.innerHTML=""; render();
      };
    };
  };
}

function logout(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}

}

/* ============ HELPERS ============ */
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function floatXp(txt){
  const el=document.createElement("div"); el.className="floater"; el.textContent=txt;
  el.style.left="50%"; el.style.top="42%"; el.style.transform="translateX(-50%)";
  lessonScreen.appendChild(el); setTimeout(()=>el.remove(),1000);
}
